---
name: Test Shopify Swatch Linker

on:
  workflow_dispatch:
    inputs:
      store:
        description: Store key from STORES in swatch_linker.py
        required: true
        default: intl
        type: string
      matrixify_download_url:
        description: Matrixify direct-download URL for the .xlsx export
        required: true
        type: string
      mode:
        description: Use dry-run first; use execute only after reviewing the report
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      confirm:
        description: Required for execute mode; type APPLY_COLOR_PATTERN_LINKS exactly
        required: false
        type: string

permissions:
  contents: read

jobs:
  swatch-linker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: |
          python swatch_linker.py \
            --store "${{ inputs.store }}" \
            --url "${{ inputs.matrixify_download_url }}" \
            --mode "${{ inputs.mode }}" \
            --confirm "${{ inputs.confirm }}"

      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: swatch-linker-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7
