---
name: Relink All Swatch Values

on:
  workflow_dispatch:
    inputs:
      store:
        description: Shopify store containing the completed Matrixify import
        required: true
        type: choice
        default: intl
        options:
          - intl
          - hk
          - tw
          - jp
          - eu
          - us
          - kr
          - th
      matrixify_download_url:
        description: Direct download URL for the completed Matrixify import workbook
        required: true
        type: string
      mode:
        description: Dry run validates all values; Execute reconnects valid complete options
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - execute

jobs:
  relink:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r relink_requirements.txt

      - name: Relink all option values
        run: >-
          python relink_all_swatch_values.py
          --store "${{ inputs.store }}"
          --url "${{ inputs.matrixify_download_url }}"
          --mode "${{ inputs.mode }}"

      - name: Upload relink report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relink-all-swatch-values-report-${{ github.run_id }}
          path: reports/relink_all_swatch_values_results.csv
          if-no-files-found: warn
