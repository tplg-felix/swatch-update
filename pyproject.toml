[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-swatch-linker"
version = "0.1.0"
description = "Safely link Matrixify-imported Shopify Color option values to Color & pattern metaobjects."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Topologie"}
]
dependencies = [
  "openpyxl>=3.1.5,<4.0",
  "python-dotenv>=1.0.1,<2.0",
  "requests>=2.32.3,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "ruff>=0.6.0,<1.0",
]

[project.scripts]
swatch-linker = "swatch_update.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
